{% extends "base.html" %}

{% block title %}Register Product | AUTHENTIX{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="glass-card p-4 p-md-5">
        <h3 class="fw-bold text-white mb-1"><i class="fa-solid fa-plus-circle text-cyan me-2"></i> Product Registration</h3>
        <p class="text-muted small mb-4">Register a genuine manufactured product. A unique Product ID, random Verification Code, and QR Reference link will be auto-generated.</p>

        <form action="{{ url_for('products.register_product') }}" method="POST">
          <div class="row g-3">

            <div class="col-md-6">
              <label class="form-label text-muted small fw-semibold">Product Name *</label>
              <input type="text" name="product_name" class="form-control bg-dark text-white border-secondary" placeholder="e.g. Organic Herbal Shampoo" required>
            </div>

            <div class="col-md-6">
              <label class="form-label text-muted small fw-semibold">Brand *</label>
              <input type="text" name="brand" class="form-control bg-dark text-white border-secondary" placeholder="e.g. Botanica Essence" required>
            </div>

            <div class="col-md-6">
              <label class="form-label text-muted small fw-semibold">Category *</label>
              <select name="category" class="form-select bg-dark text-white border-secondary" required>
                <option value="">Select Category...</option>
                <option value="Personal Care">Personal Care</option>
                <option value="Food & Beverage">Food & Beverage</option>
                <option value="Electronics">Electronics</option>
                <option value="Footwear">Footwear</option>
                <option value="Cosmetics">Cosmetics</option>
                <option value="Pharmaceuticals">Pharmaceuticals</option>
                <option value="Apparel">Apparel</option>
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label text-muted small fw-semibold">Manufacturer</label>
              <input type="text" name="manufacturer" class="form-control bg-dark text-white border-secondary" placeholder="e.g. BioFlora Labs Inc.">
            </div>

            <div class="col-md-4">
              <label class="form-label text-muted small fw-semibold">Batch Number *</label>
              <input type="text" name="batch_number" class="form-control bg-dark text-white border-secondary" placeholder="e.g. BATCH-2026-X89" required>
            </div>

            <div class="col-md-4">
              <label class="form-label text-muted small fw-semibold">Manufacturing Date</label>
              <input type="date" name="manufacturing_date" class="form-control bg-dark text-white border-secondary">
            </div>

            <div class="col-md-4">
              <label class="form-label text-muted small fw-semibold">Expiry Date</label>
              <input type="date" name="expiry_date" class="form-control bg-dark text-white border-secondary">
            </div>

            <div class="col-12">
              <label class="form-label text-muted small fw-semibold">Product Description</label>
              <textarea name="description" rows="3" class="form-control bg-dark text-white border-secondary" placeholder="Detailed product specifications..."></textarea>
            </div>

            <div class="col-12">
              <label class="form-label text-muted small fw-semibold">Product Image URL</label>
              <input type="url" name="image_url" class="form-control bg-dark text-white border-secondary" placeholder="https://example.com/images/product.jpg">
            </div>

          </div>

          <div class="d-flex justify-content-end gap-2 mt-4">
            <a href="{{ url_for('products.product_list') }}" class="btn btn-outline-cyber">Cancel</a>
            <button type="submit" class="btn btn-cyan px-4 fw-bold">
              <i class="fa-solid fa-shield-check me-2"></i> Register Product & Generate QR
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
