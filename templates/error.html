{% extends "base.html" %}

{% block title %}{{ title }} | AUTHENTIX{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="glass-card max-w-600 mx-auto p-5">
    <h1 class="display-3 fw-bold text-cyan mb-2">{{ code }}</h1>
    <h3 class="fw-bold text-white mb-3">{{ title }}</h3>
    <p class="text-muted mb-4">{{ message }}</p>

    <a href="{{ url_for('index') }}" class="btn btn-cyan px-4">
      <i class="fa-solid fa-house me-2"></i> Return to Safety
    </a>
  </div>
</div>
{% endblock %}
